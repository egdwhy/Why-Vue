services:
  mysql:
    build:
      context: .
      dockerfile: docker/mysql/Dockerfile
    image: why-mysql:8.0
    container_name: why-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-why123456}
      MYSQL_DATABASE: why-vue
      TZ: Asia/Shanghai
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 120s

  redis:
    image: redis:7-alpine
    container_name: why-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  why-backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: why-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: druid,docker
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-why123456}
      SPRING_DATASOURCE_DRUID_MASTER_URL: jdbc:mysql://mysql:3306/why-vue?useUnicode=true&characterEncoding=UTF-8&connectionCollation=utf8mb4_unicode_ci&zeroDateTimeBehavior=convertToNull&useSSL=false&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_DRUID_MASTER_USERNAME: root
      SPRING_DATASOURCE_DRUID_MASTER_PASSWORD: ${MYSQL_ROOT_PASSWORD:-why123456}
      SPRING_DATA_REDIS_HOST: redis
      TZ: Asia/Shanghai
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    volumes:
      - why_upload:/home/why/uploadPath

  why-nginx:
    build:
      context: ../Why-Vue3
      dockerfile: docker/Dockerfile
    container_name: why-nginx
    restart: unless-stopped
    depends_on:
      - why-backend
    ports:
      - "${HTTP_PORT:-80}:80"

volumes:
  mysql_data:
  why_upload:
